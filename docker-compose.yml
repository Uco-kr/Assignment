version: '3.8' # 파일 규격 버전

services:
  db:
    image: postgres:15 # 사용할 이미지 (PostgreSQL 15 버전)
    restart: always # 에러 시 자동 재시작
    environment: # DB 접속 정보 설정
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: postgres
    ports:
      - '5432:5432' # [내 컴퓨터 포트]:[컨테이너 내부 포트]
    volumes:
      - ./db_data:/var/lib/postgresql/data # 데이터 영구 저장을 위한 폴더 연결