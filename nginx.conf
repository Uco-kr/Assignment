# 1. HTTP(80 포트) 접속 시 HTTPS로 자동 리다이렉트
server {
    listen 80;
    server_name uco.o-r.kr; # 보유하신 도메인 이름으로 변경 (e.g. example.com)

    return 301 https://$host$request_uri;
}

# 2. HTTPS(443 포트) 접속 처리 및 NestJS 백엔드 프록시
server {
    listen 443 ssl;
    server_name uco.o-r.kr; # 보유하신 도메인 이름으로 변경

    # 호스트 OS에서 매핑된 Let's Encrypt 실제 인증서 파일 경로
    ssl_certificate     /etc/letsencrypt/live/uco.o-r.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uco.o-r.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # 도커 내부 네트워크를 이용해 NestJS 서버(3000)로 요청 전달
        proxy_pass http://board-server:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
